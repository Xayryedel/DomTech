<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | DomTech</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="../index.html">DomTech</a>
        </div>
        <nav>
            <a href="category.html">Каталог</a>
            <a href="cart.html" class="cart-icon">Корзина (0)</a>
        </nav>
    </header>

    <div class="container">
        <h1 style="margin-bottom: 30px; font-size: 36px;">Ваша корзина</h1>

        <div style="display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap;">
            <div id="cart-items" style="flex: 2; min-width: 300px; display: flex; flex-direction: column; gap: 15px;"></div>

            <div class="specs" style="flex: 1; min-width: 280px; margin-top: 0; background: var(--white); box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                <h3 style="font-size: 22px; margin-bottom: 20px;">Итого</h3>
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px;">
                    <span>Товары (<span id="total-count">0</span>)</span>
                    <span id="total-price">0 ₽</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 25px; font-size: 24px; font-weight: 800; color: #27ae60;">
                    <span>К оплате</span>
                    <span id="final-price">0 ₽</span>
                </div>
                <button class="btn" style="padding: 15px; font-size: 18px;" onclick="alert('Заказ оформлен! (Демо)'); localStorage.removeItem('cart'); location.reload();">Оформить заказ</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 DomTech.
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const container = document.getElementById('cart-items');
        const totalCount = document.getElementById('total-count');
        const totalPrice = document.getElementById('total-price');
        const finalPrice = document.getElementById('final-price');

        if (cart.length === 0) {
            container.innerHTML = '<p style="font-size: 18px; color: #888;">Ваша корзина пуста.</p>';
        } else {
            let sum = 0;
            cart.forEach((item) => {
                sum += item.price;
                container.innerHTML += `
                    <div class="card" style="flex-direction: row; align-items: center; padding: 15px;">
                        <img src="${item.img}" alt="${item.title}" style="width: 100px; height: 100px; margin-bottom: 0; margin-right: 20px;">
                        <div style="flex: 1;">
                            <h3 style="margin-bottom: 5px;">${item.title}</h3>
                            <div class="price" style="margin-bottom: 0;">${item.price.toLocaleString()} ₽</div>
                        </div>
                        <div style="font-weight: bold; font-size: 18px; margin-right: 20px;">1 шт.</div>
                    </div>
                `;
            });
            totalCount.textContent = cart.length;
            totalPrice.textContent = sum.toLocaleString() + ' ₽';
            finalPrice.textContent = sum.toLocaleString() + ' ₽';
        }
    </script>
    <script src="../script.js"></script>
</body>
</html>
